<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart – SmartBake</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
 
  <nav class="navbar">
    <div class="navbar-brand">SMART<span>BAKE</span></div>
    <div class="navbar-actions">
      <a href="/products" class="btn btn-ghost btn-sm">← Keep Shopping</a>
    </div>
  </nav>
 
  <div class="page-header">
    <h1 class="fade-up">Your Cart 🛒</h1>
  </div>
 
  <div class="container section">
 
    <!-- Empty cart -->
    <div th:if="${cartItems.empty}" class="empty-state fade-up">
      <div class="empty-state-icon">🛒</div>
      <h3>Your cart is empty</h3>
      <p>Looks like you haven't added any treats yet!</p>
      <a href="/products" class="btn btn-primary">Browse Treats</a>
    </div>
 
    <!-- Cart contents -->
    <div th:unless="${cartItems.empty}">
      <div class="order-table-card fade-up">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Item</th>
                <th>Price</th>
                <th>Qty</th>
                <th>Subtotal</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="item : ${cartItems}">
                <td>
                  <div style="display:flex;align-items:center;gap:0.875rem;">
                    <img th:src="${item.product.imageUrl} ?: '/images/placeholder-treat.jpg'"
                         th:alt="${item.product.name}"
                         th:title="${item.product.name}"
                         alt="Product image"
                         title="Product image"
                         style="width:56px;height:56px;object-fit:cover;border-radius:10px;border:1px solid var(--border);">
                    <span style="font-weight:600;" th:text="${item.product.name}"></span>
                  </div>
                </td>
                <td th:text="${item.product.price} + ' KSh'"></td>
                <td th:text="${item.quantity}"></td>
                <td style="color:var(--gold);font-weight:600;" th:text="${item.subtotal} + ' KSh'"></td>
                <td>
                  <form th:action="@{/cart/remove/{id}(id=${item.product.id})}" method="post">
                    <button type="submit" class="btn btn-danger btn-sm">Remove</button>
                  </form>
                </td>
              </tr>
              <tr class="total-row">
                <td colspan="3" style="text-align:right;">Total</td>
                <td colspan="2" th:text="${total} + ' KSh'"></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
 
      <div style="display:flex;gap:1rem;justify-content:flex-end;margin-top:1.5rem;flex-wrap:wrap;">
        <form th:action="@{/cart/clear}" method="post">
          <button type="submit" class="btn btn-danger">Clear Cart</button>
        </form>
        <a href="/products" class="btn btn-ghost">Continue Shopping</a>
        <a href="/cart/checkout" class="btn btn-primary">Proceed to Checkout →</a>
      </div>
    </div>
 
  </div>
 
</body>
</html>
