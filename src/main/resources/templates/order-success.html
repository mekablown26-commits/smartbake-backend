<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Placed – SmartBake</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    body {
      font-family:'DM Sans',sans-serif;
      min-height:100vh;
      background:#0f0d0b;
      color:#e8ddd0;
      display:flex;
      flex-direction:column;
      -webkit-font-smoothing:antialiased;
    }
    nav {
      display:flex; align-items:center;
      padding:1rem 2rem;
      background:rgba(15,13,11,0.96);
      -webkit-backdrop-filter:blur(20px);
      backdrop-filter:blur(20px);
      border-bottom:1px solid rgba(196,130,60,0.18);
    }
    .brand { font-family:'Playfair Display',serif; font-size:1.5rem; font-weight:700; color:#f5ede0; letter-spacing:0.05em; }
    .brand span { color:#e8b84b; }
 
    .page { flex:1; display:flex; align-items:center; justify-content:center; padding:3rem 1.5rem; }
 
    .card {
      width:100%; max-width:520px;
      background:#1a1612;
      border:1px solid rgba(196,130,60,0.22);
      border-radius:24px;
      padding:3rem 2.5rem;
      text-align:center;
      box-shadow:0 32px 80px rgba(0,0,0,0.6);
      animation:popIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes popIn {
      from { opacity:0; transform:scale(0.9); }
      to   { opacity:1; transform:scale(1); }
    }
 
    .emoji {
      font-size:3.5rem;
      display:inline-block;
      margin-bottom:1rem;
      animation:bounce 1.3s ease infinite;
    }
    @keyframes bounce {
      0%,100% { transform:translateY(0); }
      50%      { transform:translateY(-10px) scale(1.15); }
    }
 
    h1 {
      font-family:'Playfair Display',serif;
      font-size:2rem;
      color:#f5ede0;
      margin-bottom:0.75rem;
    }
    .subtitle { color:#7a6e66; font-size:0.95rem; line-height:1.65; margin-bottom:2rem; }
 
    .alert-warn {
      background:rgba(185,28,28,0.12);
      border:1px solid rgba(185,28,28,0.3);
      color:#fca5a5;
      padding:0.75rem 1rem;
      border-radius:12px;
      font-size:0.875rem;
      margin-bottom:1.5rem;
    }
 
    .details { text-align:left; margin-bottom:2rem; }
    .detail-row {
      display:flex; justify-content:space-between; align-items:center;
      padding:0.75rem 0;
      border-bottom:1px solid rgba(255,255,255,0.06);
    }
    .detail-row:last-child { border-bottom:none; }
    .detail-label { color:#7a6e66; font-size:0.82rem; text-transform:uppercase; letter-spacing:0.06em; }
    .detail-value { color:#f5ede0; font-weight:600; font-size:0.95rem; }
 
    .btns { display:flex; gap:0.75rem; justify-content:center; flex-wrap:wrap; }
    .btn {
      display:inline-flex; align-items:center;
      padding:0.65rem 1.5rem; border-radius:999px;
      font-family:'DM Sans',sans-serif; font-size:0.875rem; font-weight:600;
      cursor:pointer; border:none; text-decoration:none;
      transition:transform 0.2s,box-shadow 0.2s;
    }
    .btn-gold    { background:linear-gradient(135deg,#c8922a,#e8b84b); color:#1a1000; }
    .btn-gold:hover { transform:translateY(-2px); color:#1a1000; }
    .btn-ghost   { background:transparent; color:#e8ddd0; border:1px solid rgba(196,130,60,0.25); }
    .btn-ghost:hover { border-color:#e8b84b; color:#e8b84b; }
 
    @media (max-width:480px) {
      .card { padding:2rem 1.5rem; }
      .btns { flex-direction:column; }
    }
  </style>
</head>
<body>
 
  <nav>
    <div class="brand">SMART<span>BAKE</span></div>
  </nav>
 
  <div class="page">
    <div class="card">
      <div class="emoji">🎉</div>
      <h1>Order Placed!</h1>
      <p class="subtitle">Your treats are being prepared with love 🍪✨<br>We'll let you know when they're ready.</p>
 
      <div th:if="${order == null and orderNumber == null}" class="alert-warn">
        ⚠️ Order details temporarily unavailable — check My Orders for your status.
      </div>
 
      <div class="details">
        <div class="detail-row">
          <span class="detail-label">Order Number</span>
          <span class="detail-value"
                th:text="${orderNumber != null ? '#SB-' + orderNumber : (order != null ? '#SB-' + order.id : '—')}"></span>
        </div>
        <div class="detail-row" th:if="${total != null}">
          <span class="detail-label">Total Amount</span>
          <span class="detail-value" th:text="${total} + ' KSh'"></span>
        </div>
        <div class="detail-row" th:if="${order != null}">
          <span class="detail-label">Payment</span>
          <span class="detail-value"
                th:text="${order.paymentMethod == 'CASH' ? '💵 Cash on Delivery' :
                           order.paymentMethod == 'PAYBILL' ? '📱 M-Pesa Paybill' : order.paymentMethod}"></span>
        </div>
        <div class="detail-row" th:if="${order != null}">
          <span class="detail-label">Status</span>
          <span class="detail-value" th:text="${order.status}"></span>
        </div>
      </div>
 
      <div class="btns">
        <a href="/dashboard" class="btn btn-gold">Back to Dashboard</a>
        <a href="/my-orders" class="btn btn-ghost">View My Orders</a>
      </div>
    </div>
  </div>
 
</body>
</html>
