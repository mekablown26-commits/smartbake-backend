<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Placed – SmartBake</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
 
  <nav class="navbar">
    <div class="navbar-brand">SMART<span>BAKE</span></div>
  </nav>
 
  <div class="container">
    <div class="success-card card fade-up">
      <div class="bounce">🎉</div>
      <h1 style="color:var(--cream);margin-bottom:1rem;">Order Placed!</h1>
      <p style="color:var(--text-muted);font-size:1.05rem;margin-bottom:2rem;">
        Your treats are being prepared with love 🍪✨<br>
        We'll let you know when they're ready.
      </p>
 
      <div th:if="${order == null and orderNumber == null}"
           class="alert alert-error" style="margin-bottom:1.5rem;">
        ⚠️ Order details temporarily unavailable — check My Orders for your status.
      </div>
 
      <div class="order-detail-grid">
        <div class="order-detail-row">
          <span class="order-detail-label">Order Number</span>
          <span class="order-detail-value"
                th:text="${orderNumber != null ? '#SB-' + orderNumber : (order != null ? '#SB-' + order.id : '—')}"></span>
        </div>
        <div class="order-detail-row" th:if="${total != null}">
          <span class="order-detail-label">Total Amount</span>
          <span class="order-detail-value" th:text="${total} + ' KSh'"></span>
        </div>
        <div class="order-detail-row" th:if="${order != null}">
          <span class="order-detail-label">Payment Method</span>
          <span class="order-detail-value"
                th:text="${order.paymentMethod == 'CASH' ? '💵 Cash on Delivery' :
                           order.paymentMethod == 'PAYBILL' ? '📱 M-Pesa Paybill' : order.paymentMethod}"></span>
        </div>
        <div class="order-detail-row" th:if="${order != null}">
          <span class="order-detail-label">Status</span>
          <span class="order-detail-value" th:text="${order.status}"></span>
        </div>
      </div>
 
      <div style="display:flex;gap:1rem;justify-content:center;margin-top:2rem;flex-wrap:wrap;">
        <a href="/dashboard" class="btn btn-gold">Back to Dashboard</a>
        <a href="/my-orders" class="btn btn-ghost">View My Orders</a>
      </div>
    </div>
  </div>
 
</body>
</html>
