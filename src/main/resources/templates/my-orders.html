<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders – SmartBake</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
 
    body {
      font-family:'DM Sans',sans-serif;
      min-height:100vh;
      background:#0f0d0b url('/images/macarons.jpg') center/cover fixed no-repeat;
      color:#e8ddd0;
      -webkit-font-smoothing:antialiased;
      position:relative;
    }
    body::before {
      content:'';
      position:fixed; inset:0;
      background:linear-gradient(160deg,rgba(10,7,5,0.88) 0%,rgba(12,9,7,0.78) 100%);
      z-index:0;
    }
    body > * { position:relative; z-index:1; }
 
    .container { max-width:1100px; margin:4rem auto; padding:0 1.5rem; }
 
    h1 {
      font-family:'Playfair Display',serif;
      text-align:center;
      color:#f5ede0;
      font-size:clamp(2rem,5vw,3rem);
      margin-bottom:2.5rem;
      animation:fadeUp 0.5s ease both;
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(20px); }
      to   { opacity:1; transform:translateY(0); }
    }
 
    /* ── Table card ── */
    .orders-card {
      background:rgba(20,16,12,0.92);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      border:1px solid rgba(196,130,60,0.2);
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 24px 64px rgba(0,0,0,0.65);
      animation:fadeUp 0.5s 0.1s ease both;
    }
 
    table { width:100%; border-collapse:collapse; }
    thead th {
      background:rgba(196,48,80,0.18);
      color:#f5ede0;
      font-size:0.75rem;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:0.08em;
      padding:1rem 1.25rem;
      border-bottom:1px solid rgba(196,48,80,0.2);
    }
    tbody td {
      padding:1rem 1.25rem;
      border-bottom:1px solid rgba(255,255,255,0.05);
      color:#e8ddd0;
      vertical-align:middle;
    }
    tbody tr:last-child td { border-bottom:none; }
    tbody tr { transition:background 0.2s; }
    tbody tr:hover td { background:rgba(196,48,80,0.05); }
 
    .order-id { font-weight:700; color:#e8b84b; }
 
    /* Status pills */
    .pill {
      padding:0.3rem 0.85rem;
      border-radius:999px;
      font-size:0.75rem;
      font-weight:700;
      display:inline-block;
      text-transform:uppercase;
      letter-spacing:0.05em;
    }
    .pill-pending    { background:rgba(234,179,8,0.15);  color:#fcd34d; border:1px solid rgba(234,179,8,0.3); }
    .pill-processing { background:rgba(59,130,246,0.15); color:#93c5fd; border:1px solid rgba(59,130,246,0.3); }
    .pill-ready      { background:rgba(34,197,94,0.15);  color:#86efac; border:1px solid rgba(34,197,94,0.3); }
    .pill-delivered  { background:rgba(16,185,129,0.12); color:#6ee7b7; border:1px solid rgba(16,185,129,0.25); }
    .pill-cancelled  { background:rgba(185,28,28,0.15);  color:#fca5a5; border:1px solid rgba(185,28,28,0.3); }
 
    /* Buttons */
    .btn {
      display:inline-flex; align-items:center;
      padding:0.38rem 0.9rem; border-radius:999px;
      font-family:'DM Sans',sans-serif; font-size:0.78rem; font-weight:600;
      cursor:pointer; border:none; text-decoration:none;
      transition:transform 0.2s,box-shadow 0.2s;
    }
    .btn-danger { background:linear-gradient(135deg,#b91c1c,#991b1b); color:#fff; box-shadow:0 3px 10px rgba(185,28,28,0.3); }
    .btn-danger:hover { transform:translateY(-1px); box-shadow:0 6px 16px rgba(185,28,28,0.45); color:#fff; }
    .action-link { color:#e8b84b; font-weight:600; text-decoration:none; font-size:0.875rem; transition:color 0.2s; margin-left:0.5rem; }
    .action-link:hover { color:#c8922a; }
 
    /* Back button */
    .back-wrap { text-align:center; padding:1.75rem; }
    .btn-back {
      display:inline-flex; align-items:center; gap:0.4rem;
      padding:0.7rem 2rem;
      background:linear-gradient(135deg,#c43050,#9e1f3b);
      color:#fff; border-radius:999px;
      text-decoration:none; font-weight:600; font-size:0.9rem;
      box-shadow:0 4px 16px rgba(196,48,80,0.35);
      transition:transform 0.2s,box-shadow 0.2s;
    }
    .btn-back:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(196,48,80,0.5); color:#fff; }
 
    /* Empty state */
    .no-orders { text-align:center; padding:6rem 2rem; color:#7a6e66; animation:fadeUp 0.5s ease both; }
    .no-orders .icon { font-size:4rem; display:block; margin-bottom:1.25rem; }
    .no-orders p { font-size:1.05rem; margin-bottom:1.75rem; }
 
    @media (max-width:768px) {
      .container { padding:0 1rem; margin:2.5rem auto; }
      table { font-size:0.85rem; }
      thead th, tbody td { padding:0.85rem 0.9rem; }
    }
  </style>
</head>
<body>
 
  <div class="container">
    <h1>My Orders 📋</h1>
 
    <div th:if="${orders.empty}" class="no-orders">
      <span class="icon">📦</span>
      <p>You haven't placed any orders yet 😔</p>
      <a href="/dashboard" class="btn-back">← Back to Dashboard</a>
    </div>
 
    <div th:unless="${orders.empty}" class="orders-card">
      <table>
        <thead>
          <tr>
            <th>Order</th>
            <th>Total</th>
            <th>Status</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="order : ${orders}">
            <td><span class="order-id" th:text="'SB-' + ${order.id}"></span></td>
            <td th:text="${order.totalAmount} + ' KSh'"></td>
            <td>
              <span th:class="'pill pill-' + ${#strings.toLowerCase(order.status)}"
                    th:text="${order.status}"></span>
            </td>
            <td th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy HH:mm')}"></td>
            <td>
              <form th:if="${order.status == 'PENDING' or order.status == 'PROCESSING'}"
                    th:action="@{/orders/{id}/cancel(id=${order.id})}"
                    method="post" style="display:inline;">
                <button type="submit"
                        onclick="return confirm('Cancel this order? This cannot be undone.')"
                        class="btn btn-danger">Cancel</button>
              </form>
              <a th:href="@{/my-orders/{id}(id=${order.id})}" class="action-link">View →</a>
            </td>
          </tr>
        </tbody>
      </table>
      <div class="back-wrap">
        <a href="/dashboard" class="btn-back">← Back to Dashboard</a>
      </div>
    </div>
  </div>
 
</body>
</html>
