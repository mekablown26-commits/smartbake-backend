<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account – SmartBake</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page bg-image" style="background-image:url('/images/wheat.jpg');">
 
  <div class="auth-card fade-up" style="max-width:460px;">
    <div class="auth-logo">SMART<span>BAKE</span></div>
    <p class="auth-subtitle">Join us for fresh treats every day 🍰</p>
 
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
 
    <form th:action="@{/register}" method="post" class="auth-form">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input class="form-input" type="text" name="fullName" placeholder="Jane Wanjiku" required>
      </div>
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input class="form-input" type="email" name="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">Phone Number</label>
        <input class="form-input" type="tel" name="phone" placeholder="07XX XXX XXX" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" type="password" name="password" placeholder="Min. 8 characters" required>
      </div>
      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <input class="form-input" type="password" name="confirmPassword" placeholder="Repeat password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" style="margin-top:0.5rem;">Create Account</button>
    </form>
 
    <div class="auth-footer">
      Already have an account? <a href="/login">Sign in →</a>
    </div>
  </div>
 
</body>
</html>
