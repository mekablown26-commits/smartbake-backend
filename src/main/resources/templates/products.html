<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Treats – SmartBake</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
    body {
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      background: #0f0d0b;
      color: #e8ddd0;
      -webkit-font-smoothing: antialiased;
    }
 
    /* ── Navbar ── */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      background: rgba(15,13,11,0.96);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(196,130,60,0.18);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand { font-family:'Playfair Display',serif; font-size:1.5rem; font-weight:700; color:#f5ede0; letter-spacing:0.05em; }
    .brand span { color:#e8b84b; }
    .nav-right { display:flex; align-items:center; gap:0.75rem; }
 
    .cart-btn {
      display:flex; align-items:center; gap:0.4rem;
      color:#e8ddd0; font-size:0.875rem; font-weight:500;
      padding:0.45rem 1rem; border-radius:999px;
      border:1px solid rgba(255,255,255,0.1);
      text-decoration:none; transition:border-color 0.22s,color 0.22s;
    }
    .cart-btn:hover { border-color:#e8b84b; color:#e8b84b; }
    .cart-badge {
      background:#c43050; color:#fff; border-radius:50%;
      min-width:18px; height:18px; font-size:0.7rem; font-weight:700;
      display:inline-flex; align-items:center; justify-content:center;
    }
    .btn-ghost-nav {
      color:#9a8e82; font-size:0.875rem; font-weight:500;
      padding:0.45rem 1rem; border-radius:999px;
      border:1px solid rgba(255,255,255,0.08);
      text-decoration:none; transition:color 0.2s,border-color 0.2s;
    }
    .btn-ghost-nav:hover { color:#e8b84b; border-color:rgba(196,130,60,0.3); }
 
    /* ── Page header ── */
    .page-header {
      text-align:center;
      padding:3rem 1.5rem 2rem;
      border-bottom:1px solid rgba(255,255,255,0.05);
    }
    .page-header h1 {
      font-family:'Playfair Display',serif;
      font-size:clamp(2rem,5vw,3.25rem);
      color:#f5ede0;
      margin-bottom:0.4rem;
      animation:fadeUp 0.5s ease both;
    }
    .page-header p { color:#7a6e66; font-size:1rem; animation:fadeUp 0.5s 0.1s ease both; }
 
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(18px); }
      to   { opacity:1; transform:translateY(0); }
    }
 
    /* ── Grid ── */
    .container { max-width:1200px; margin:0 auto; padding:2.5rem 1.5rem 4rem; }
 
    .product-grid {
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(270px,1fr));
      gap:1.5rem;
    }
 
    .product-card {
      background:#1a1612;
      border:1px solid rgba(255,255,255,0.07);
      border-radius:20px;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      transition:transform 0.28s, border-color 0.28s, box-shadow 0.28s;
      animation:fadeUp 0.5s ease both;
    }
    .product-card:hover {
      transform:translateY(-6px);
      border-color:rgba(196,130,60,0.28);
      box-shadow:0 20px 50px rgba(0,0,0,0.55);
    }
 
    .product-img {
      width:100%;
      height:220px;
      object-fit:cover;
      transition:transform 0.5s ease;
    }
    .product-card:hover .product-img { transform:scale(1.04); }
 
    .product-body { padding:1.25rem 1.25rem 0.75rem; flex:1; }
    .product-name {
      font-family:'Playfair Display',serif;
      font-size:1.1rem;
      color:#f5ede0;
      margin-bottom:0.3rem;
      font-weight:600;
    }
    .product-price { color:#e8b84b; font-size:1.05rem; font-weight:700; margin-bottom:0.5rem; }
    .product-desc  { color:#7a6e66; font-size:0.85rem; line-height:1.55; }
 
    .product-footer { padding:0.75rem 1.25rem 1.25rem; }
 
    .add-form { display:flex; gap:0.65rem; align-items:center; width:100%; }
 
    .qty-input {
      width:68px;
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:10px;
      padding:0.6rem 0.75rem;
      color:#e8ddd0;
      font-family:'DM Sans',sans-serif;
      font-size:0.9rem;
      text-align:center;
      outline:none;
      transition:border-color 0.2s;
    }
    .qty-input:focus { border-color:#c8922a; }
 
    .btn-add {
      flex:1;
      padding:0.65rem 1rem;
      background:linear-gradient(135deg,#c43050,#9e1f3b);
      color:#fff;
      border:none;
      border-radius:999px;
      font-family:'DM Sans',sans-serif;
      font-size:0.875rem;
      font-weight:600;
      cursor:pointer;
      transition:transform 0.2s, box-shadow 0.2s;
      box-shadow:0 4px 14px rgba(196,48,80,0.32);
    }
    .btn-add:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(196,48,80,0.5); }
 
    /* ── Empty state ── */
    .empty-state { text-align:center; padding:5rem 2rem; }
    .empty-state .icon { font-size:3.5rem; margin-bottom:1rem; }
    .empty-state h3 { font-family:'Playfair Display',serif; font-size:1.4rem; color:#f5ede0; margin-bottom:0.5rem; }
    .empty-state p  { color:#7a6e66; margin-bottom:1.75rem; }
    .btn-back {
      display:inline-flex; align-items:center; gap:0.4rem;
      padding:0.65rem 1.5rem;
      background:linear-gradient(135deg,#c43050,#9e1f3b);
      color:#fff; border-radius:999px;
      text-decoration:none; font-weight:600; font-size:0.9rem;
      box-shadow:0 4px 14px rgba(196,48,80,0.35);
      transition:transform 0.2s, box-shadow 0.2s;
    }
    .btn-back:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(196,48,80,0.5); color:#fff; }
 
    .sr-only { position:absolute; width:1px; height:1px; clip:rect(0,0,0,0); overflow:hidden; }
 
    @media (max-width:768px) {
      nav { padding:0.85rem 1.25rem; }
      .container { padding:2rem 1rem 3rem; }
      .product-grid { grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:1rem; }
    }
  </style>
</head>
<body>
 
  <nav>
    <div class="brand">SMART<span>BAKE</span></div>
    <div class="nav-right">
      <a href="/cart" class="cart-btn">
        🛒 Cart
        <span th:if="${session.cart != null and !session.cart.empty}" class="cart-badge" th:text="${session.cart.size()}"></span>
      </a>
      <a href="/dashboard" class="btn-ghost-nav">Dashboard</a>
    </div>
  </nav>
 
  <div class="page-header">
    <h1>Fresh Treats 🧁</h1>
    <p>Handcrafted daily — pick your favourites</p>
  </div>
 
  <div class="container">
 
    <div th:if="${products == null or products.empty}" class="empty-state">
      <div class="icon">🥺</div>
      <h3>No treats right now</h3>
      <p>Check back soon — we bake fresh daily!</p>
      <a href="/dashboard" class="btn-back">← Back to Dashboard</a>
    </div>
 
    <div class="product-grid" th:unless="${products == null or products.empty}">
      <div th:each="product : ${products}" class="product-card">
        <img th:src="${product.imageUrl} ?: '/images/cakey.jpg'"
             th:alt="${product.name}"
             th:title="${product.name}"
             alt="Product image"
             class="product-img">
        <div class="product-body">
          <div class="product-name" th:text="${product.name}"></div>
          <div class="product-price" th:text="${product.price} + ' KSh'"></div>
          <p class="product-desc" th:text="${product.description}"></p>
        </div>
        <div class="product-footer">
          <form th:action="@{/cart/add/{id}(id=${product.id})}" method="post" class="add-form">
            <label th:for="'qty-' + ${product.id}" class="sr-only">Quantity</label>
            <input th:id="'qty-' + ${product.id}" type="number" name="quantity"
                   value="1" min="1" class="qty-input" required title="Quantity">
            <button type="submit" class="btn-add">Add to Cart</button>
          </form>
        </div>
      </div>
    </div>
 
  </div>
 
</body>
</html>
