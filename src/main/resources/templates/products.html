<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Treats – SmartBake</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
 
  <nav class="navbar">
    <div class="navbar-brand">SMART<span>BAKE</span></div>
    <div class="navbar-actions">
      <a href="/cart" class="cart-link">
        🛒 Cart
        <span th:if="${session.cart != null and !session.cart.empty}" class="cart-badge" th:text="${session.cart.size()}"></span>
      </a>
      <a href="/dashboard" class="btn btn-ghost btn-sm">Dashboard</a>
    </div>
  </nav>
 
  <div class="page-header">
    <h1 class="fade-up">Fresh Treats 🧁</h1>
    <p class="fade-up delay-1">Handcrafted daily — pick your favourites</p>
  </div>
 
  <div class="container section">
 
    <!-- Empty state -->
    <div th:if="${products == null or products.empty}" class="empty-state">
      <div class="empty-state-icon">🥺</div>
      <h3>No treats right now</h3>
      <p>Check back soon — we bake fresh daily!</p>
      <a href="/dashboard" class="btn btn-primary">Back to Dashboard</a>
    </div>
 
    <!-- Products grid -->
    <div class="product-grid" th:unless="${products == null or products.empty}">
      <div th:each="product : ${products}" class="product-card fade-up">
        <img th:src="${product.imageUrl} ?: '/images/cakey.jpg'"
             th:alt="${product.name}"
             th:title="${product.name}"
             alt="Product image"
             class="product-img">
        <div class="product-body">
          <div class="product-name" th:text="${product.name}"></div>
          <div class="product-price" th:text="${product.price} + ' KSh'"></div>
          <p class="product-desc" th:text="${product.description}"></p>
        </div>
        <div class="product-footer">
          <form th:action="@{/cart/add/{id}(id=${product.id})}" method="post" style="display:flex;gap:0.75rem;align-items:center;width:100%;">
            <label for="quantity-[[${product.id}]]" class="sr-only">Quantity</label>
            <input id="quantity-[[${product.id}]]" type="number" name="quantity" value="1" min="1" class="qty-input" required
                   title="Enter quantity" placeholder="Quantity">
            <button type="submit" class="btn btn-primary" style="flex:1;">Add to Cart</button>
          </form>
        </div>
      </div>
    </div>
 
  </div>
 
</body>
</html>
