<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout – SmartBake</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
 
  <nav class="navbar">
    <div class="navbar-brand">SMART<span>BAKE</span></div>
    <div class="navbar-actions">
      <a href="/cart" class="btn btn-ghost btn-sm">← Back to Cart</a>
    </div>
  </nav>
 
  <div class="page-header">
    <h1 class="fade-up">Checkout 🍰</h1>
    <p class="fade-up delay-1">Almost there — just confirm your details</p>
  </div>
 
  <div class="checkout-grid">
 
    <!-- Order Summary -->
    <div class="card fade-up" style="padding:1.75rem;">
      <h3 style="color:var(--cream);margin-bottom:1.25rem;">Order Summary</h3>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Item</th>
              <th>Qty</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="item : ${cartItems}">
              <td th:text="${item.product.name}"></td>
              <td th:text="${item.quantity}"></td>
              <td style="color:var(--gold);font-weight:600;" th:text="${item.subtotal} + ' KSh'"></td>
            </tr>
            <tr class="total-row">
              <td colspan="2">Total</td>
              <td th:text="${total} + ' KSh'"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
 
    <!-- Details form -->
    <div class="card fade-up delay-1" style="padding:1.75rem;">
      <h3 style="color:var(--cream);margin-bottom:1.25rem;">Your Details</h3>
      <form th:action="@{/cart/checkout}" method="post" style="display:flex;flex-direction:column;gap:1rem;">
        <div class="form-group">
          <label class="form-label">Full Name *</label>
          <input class="form-input" type="text" name="customerName" placeholder="Jane Wanjiku" required>
        </div>
        <div class="form-group">
          <label class="form-label">Phone Number *</label>
          <input class="form-input" type="tel" name="customerPhone" placeholder="07XX XXX XXX" required>
        </div>
        <div class="form-group">
          <label class="form-label">Delivery / Pickup Location</label>
          <textarea class="form-input" name="deliveryAddress" rows="2" placeholder="Address or preferred pickup point"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Special Notes</label>
          <textarea class="form-input" name="notes" rows="2" placeholder="e.g. Add candles, no nuts, etc."></textarea>
        </div>
        <div class="form-group">
          <label class="form-label" for="paymentMethod">Payment Method *</label>
          <select class="form-input" id="paymentMethod" name="paymentMethod" title="Payment Method" required>
            <option value="CASH">💵 Cash on Pickup / Delivery</option>
            <option value="PAYBILL">📱 M-Pesa Paybill</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top:0.5rem;">
          ✅ Confirm & Place Order
        </button>
      </form>
    </div>
 
  </div>
 
</body>
</html>
