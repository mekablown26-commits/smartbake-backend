<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Products – SmartBake Admin</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    /* Admin-specific tweaks */
    .fab {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--blush), var(--blush-dark));
      color: #fff;
      font-size: 1.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(196,48,80,0.45);
      border: none;
      cursor: pointer;
      z-index: 50;
      transition: var(--transition);
    }
    .fab:hover { transform: scale(1.1) rotate(45deg); }
  </style>
</head>
<body class="admin-page">
 
  <!-- Top bar -->
  <div class="admin-topbar">
    <div style="display:flex;align-items:center;gap:1rem;">
      <a href="/dashboard" class="btn btn-ghost btn-sm">← Dashboard</a>
      <span class="admin-title">🍰 Manage Products</span>
    </div>
    <div style="display:flex;align-items:center;gap:0.75rem;">
      <span th:if="${successMessage}" class="alert alert-success" style="margin:0;padding:0.5rem 1rem;" th:text="${successMessage}"></span>
      <button class="btn btn-primary btn-sm" onclick="openModal()">+ Add Product</button>
      <form th:action="@{/logout}" method="post">
        <button type="submit" class="logout-btn">Sign out</button>
      </form>
    </div>
  </div>
 
  <!-- Product grid -->
  <div class="admin-grid">
    <div th:each="product : ${products}" class="admin-product-card">
      <img th:src="${product.imageUrl} ?: '/images/cakey.jpg'"
           th:alt="${product.name} ?: 'Product image'"
           th:title="${product.name} ?: 'Product image'"
           alt="Product image"
           title="Product image"
           class="admin-product-img">
      <div class="admin-product-body">
        <div class="admin-product-name" th:text="${product.name}"></div>
        <div class="admin-product-price" th:text="${product.price} + ' KSh'"></div>
        <div style="margin-bottom:0.5rem;">
          <span th:if="${product.stockQuantity <= 10}" class="stock-badge pill-low">
            ⚠️ <span th:text="${product.stockQuantity} + ' left (low)'"></span>
          </span>
          <span th:if="${product.stockQuantity > 10}" class="stock-badge pill-stock">
            ✅ <span th:text="${product.stockQuantity} + ' in stock'"></span>
          </span>
        </div>
      </div>
      <div class="admin-product-footer">
        <button class="btn btn-ghost btn-sm"
                th:onclick="'openEditModal(' + ${product.id} + ', \'' + ${product.name} + '\', ' + ${product.price} + ', \'' + (${product.description} ?: '') + '\', ' + ${product.stockQuantity} + ', \'' + (${product.imageUrl} ?: '') + '\')'">
          ✏️ Edit
        </button>
        <!-- FIX: use a proper POST form for delete, not a GET link -->
        <form th:action="@{/admin/products/delete/{id}(id=${product.id})}"
              method="post"
              onsubmit="return confirm('Delete this product? This cannot be undone.')">
          <button type="submit" class="btn btn-danger btn-sm">🗑 Delete</button>
        </form>
      </div>
    </div>
  </div>
 
  <!-- FAB for mobile -->
  <button class="fab" onclick="openModal()" title="Add Product">+</button>
 
  <!-- Add/Edit Modal -->
  <div class="modal-overlay" id="productModal">
    <div class="modal-box">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle">Add New Product</span>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <form id="productForm" method="post" class="modal-form">
        <input type="hidden" id="productId" name="id">
        <div class="form-group">
          <label class="form-label">Product Name *</label>
          <input class="form-input" type="text" id="productName" name="name" placeholder="e.g. Chocolate Fudge Cake" required>
        </div>
        <div class="form-group">
          <label class="form-label">Price (KSh) *</label>
          <input class="form-input" type="number" id="productPrice" name="price" placeholder="e.g. 2500" min="1" step="0.01" required>
        </div>
        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea class="form-input" id="productDesc" name="description" rows="2" placeholder="Short description for customers"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Stock Quantity *</label>
          <input class="form-input" type="number" id="productStock" name="stockQuantity" placeholder="e.g. 20" min="0" required>
        </div>
        <div class="form-group">
          <label class="form-label">Image URL</label>
          <input class="form-input" type="text" id="productImage" name="imageUrl" placeholder="https://... or /images/...">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="submitBtn">💾 Save Product</button>
        </div>
      </form>
    </div>
  </div>
 
  <script>
    const modal = document.getElementById('productModal');
 
    function openModal() {
      document.getElementById('modalTitle').textContent = 'Add New Product';
      document.getElementById('productForm').action = '/admin/products/add';
      document.getElementById('submitBtn').textContent = '➕ Add Product';
      document.getElementById('productId').value = '';
      document.getElementById('productName').value = '';
      document.getElementById('productPrice').value = '';
      document.getElementById('productDesc').value = '';
      document.getElementById('productStock').value = '';
      document.getElementById('productImage').value = '';
      modal.classList.add('open');
    }
 
    function openEditModal(id, name, price, desc, stock, imageUrl) {
      document.getElementById('modalTitle').textContent = 'Edit Product';
      document.getElementById('productForm').action = '/admin/products/edit/' + id;
      document.getElementById('submitBtn').textContent = '💾 Save Changes';
      document.getElementById('productId').value = id;
      document.getElementById('productName').value = name;
      document.getElementById('productPrice').value = price;
      document.getElementById('productDesc').value = desc;
      document.getElementById('productStock').value = stock;
      document.getElementById('productImage').value = imageUrl;
      modal.classList.add('open');
    }
 
    function closeModal() { modal.classList.remove('open'); }
 
    modal.addEventListener('click', e => {
      if (e.target === modal) closeModal();
    });
  </script>
 
</body>
</html>
