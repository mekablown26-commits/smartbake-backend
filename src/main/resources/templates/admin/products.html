<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Products – SmartBake Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    body {
      font-family:'DM Sans',sans-serif;
      min-height:100vh;
      background:#0f0d0b;
      color:#e8ddd0;
      padding-bottom:5rem;
      -webkit-font-smoothing:antialiased;
    }
 
    /* ── Topbar ── */
    .topbar {
      display:flex; align-items:center; justify-content:space-between;
      padding:1rem 2rem;
      background:rgba(15,13,11,0.97);
      -webkit-backdrop-filter:blur(20px);
      backdrop-filter:blur(20px);
      border-bottom:1px solid rgba(196,130,60,0.2);
      position:sticky; top:0; z-index:100;
      gap:1rem; flex-wrap:wrap;
    }
    .topbar-left { display:flex; align-items:center; gap:1rem; }
    .topbar-right { display:flex; align-items:center; gap:0.75rem; flex-wrap:wrap; }
 
    .brand { font-family:'Playfair Display',serif; font-size:1.25rem; font-weight:600; color:#f5ede0; }
    .brand span { color:#e8b84b; }
 
    .btn {
      display:inline-flex; align-items:center; justify-content:center; gap:0.35rem;
      padding:0.5rem 1.1rem; border-radius:999px;
      font-family:'DM Sans',sans-serif; font-size:0.83rem; font-weight:600;
      cursor:pointer; border:none; text-decoration:none;
      transition:transform 0.2s,box-shadow 0.2s; white-space:nowrap;
    }
    .btn:active { transform:scale(0.97); }
    .btn-primary { background:linear-gradient(135deg,#c43050,#9e1f3b); color:#fff; box-shadow:0 4px 14px rgba(196,48,80,0.32); }
    .btn-primary:hover { transform:translateY(-1px); box-shadow:0 6px 20px rgba(196,48,80,0.5); color:#fff; }
    .btn-ghost { background:transparent; color:#9a8e82; border:1px solid rgba(255,255,255,0.1); }
    .btn-ghost:hover { border-color:rgba(196,130,60,0.3); color:#e8b84b; }
    .btn-danger { background:linear-gradient(135deg,#b91c1c,#991b1b); color:#fff; box-shadow:0 3px 10px rgba(185,28,28,0.28); }
    .btn-danger:hover { transform:translateY(-1px); box-shadow:0 5px 14px rgba(185,28,28,0.45); color:#fff; }
    .btn-sm { padding:0.35rem 0.85rem; font-size:0.78rem; }
    .btn-warn {
      background:transparent; color:#fca5a5;
      border:1px solid rgba(185,28,28,0.35);
      padding:0.42rem 1rem; border-radius:999px;
      font-family:'DM Sans',sans-serif; font-size:0.82rem; font-weight:600;
      cursor:pointer; transition:background 0.2s;
    }
    .btn-warn:hover { background:rgba(185,28,28,0.15); }
 
    .alert-success {
      background:rgba(22,163,74,0.15);
      border:1px solid rgba(22,163,74,0.3);
      color:#86efac;
      padding:0.45rem 1rem;
      border-radius:999px;
      font-size:0.83rem;
    }
 
    /* ── Product grid ── */
    .grid {
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(240px,1fr));
      gap:1.5rem;
      max-width:1300px;
      margin:2.5rem auto;
      padding:0 2rem;
    }
 
    .product-card {
      background:#1a1612;
      border:1px solid rgba(255,255,255,0.07);
      border-radius:18px;
      overflow:hidden;
      display:flex; flex-direction:column;
      transition:transform 0.26s,border-color 0.26s,box-shadow 0.26s;
      animation:fadeUp 0.5s ease both;
    }
    .product-card:hover {
      transform:translateY(-5px);
      border-color:rgba(196,130,60,0.28);
      box-shadow:0 16px 40px rgba(0,0,0,0.5);
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(18px); }
      to   { opacity:1; transform:translateY(0); }
    }
 
    .product-img { width:100%; height:175px; object-fit:cover; }
    .product-body { padding:1rem 1.1rem 0.5rem; flex:1; }
    .product-name {
      font-family:'Playfair Display',serif;
      font-size:1rem; color:#f5ede0; font-weight:600; margin-bottom:0.25rem;
    }
    .product-price { color:#e8b84b; font-weight:700; margin-bottom:0.5rem; font-size:0.95rem; }
 
    .stock-badge {
      display:inline-flex; align-items:center; gap:0.3rem;
      padding:0.22rem 0.7rem; border-radius:999px;
      font-size:0.76rem; font-weight:600;
    }
    .stock-low  { background:rgba(185,28,28,0.15); color:#fca5a5; border:1px solid rgba(185,28,28,0.28); }
    .stock-ok   { background:rgba(22,163,74,0.12);  color:#86efac; border:1px solid rgba(22,163,74,0.22); }
 
    .product-footer {
      display:flex; gap:0.5rem;
      padding:0.75rem 1.1rem 1rem;
      border-top:1px solid rgba(255,255,255,0.05);
    }
 
    /* ── FAB ── */
    .fab {
      position:fixed; bottom:1.5rem; right:1.5rem;
      width:54px; height:54px; border-radius:50%;
      background:linear-gradient(135deg,#c43050,#9e1f3b);
      color:#fff; font-size:1.6rem;
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 8px 24px rgba(196,48,80,0.45);
      border:none; cursor:pointer; z-index:50;
      transition:transform 0.25s,box-shadow 0.25s;
    }
    .fab:hover { transform:scale(1.1) rotate(45deg); box-shadow:0 12px 32px rgba(196,48,80,0.6); }
 
    /* ── Modal ── */
    .modal-overlay {
      position:fixed; inset:0;
      background:rgba(0,0,0,0.75);
      -webkit-backdrop-filter:blur(6px);
      backdrop-filter:blur(6px);
      display:flex; align-items:center; justify-content:center;
      z-index:999; opacity:0; pointer-events:none;
      transition:opacity 0.26s ease;
      padding:1.5rem;
    }
    .modal-overlay.open { opacity:1; pointer-events:all; }
 
    .modal-box {
      background:#1e1a15;
      border:1px solid rgba(196,130,60,0.22);
      border-radius:20px;
      width:100%; max-width:490px;
      max-height:90vh; overflow-y:auto;
      box-shadow:0 32px 80px rgba(0,0,0,0.7);
      transform:scale(0.95);
      transition:transform 0.26s ease;
    }
    .modal-overlay.open .modal-box { transform:scale(1); }
 
    .modal-header {
      display:flex; align-items:center; justify-content:space-between;
      padding:1.4rem 1.75rem 1rem;
      border-bottom:1px solid rgba(255,255,255,0.06);
    }
    .modal-title { font-family:'Playfair Display',serif; font-size:1.15rem; color:#f5ede0; font-weight:600; }
    .modal-close {
      background:transparent;
      border:1px solid rgba(255,255,255,0.1);
      color:#9a8e82; border-radius:50%;
      width:30px; height:30px; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      font-size:0.95rem; transition:background 0.2s,color 0.2s;
    }
    .modal-close:hover { background:rgba(185,28,28,0.2); color:#fca5a5; border-color:rgba(185,28,28,0.4); }
 
    .modal-form { padding:1.25rem 1.75rem; display:flex; flex-direction:column; gap:1rem; }
    .modal-footer { display:flex; gap:0.75rem; justify-content:flex-end; padding-top:0.5rem; }
 
    .field { display:flex; flex-direction:column; gap:0.35rem; }
    label {
      font-size:0.77rem; font-weight:600;
      color:#8a7e76; text-transform:uppercase; letter-spacing:0.07em;
    }
    input, textarea {
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:11px;
      padding:0.72rem 1rem;
      color:#e8ddd0;
      font-family:'DM Sans',sans-serif; font-size:0.9rem;
      outline:none; width:100%;
      transition:border-color 0.22s,box-shadow 0.22s,background 0.22s;
    }
    input::placeholder, textarea::placeholder { color:#4a4038; }
    input:focus, textarea:focus {
      border-color:#c8922a;
      background:rgba(200,146,42,0.06);
      box-shadow:0 0 0 3px rgba(200,146,42,0.14);
    }
    textarea { resize:vertical; min-height:70px; }
 
    @media (max-width:768px) {
      .topbar { padding:0.85rem 1.25rem; }
      .grid { padding:0 1rem; gap:1rem; }
    }
  </style>
</head>
<body>
 
  <div class="topbar">
    <div class="topbar-left">
      <a href="/dashboard" class="btn btn-ghost btn-sm">← Dashboard</a>
      <span class="brand">🍰 SMART<span>BAKE</span> Admin</span>
    </div>
    <div class="topbar-right">
      <span th:if="${successMessage}" class="alert-success" th:text="${successMessage}"></span>
      <button class="btn btn-primary btn-sm" onclick="openModal()">+ Add Product</button>
      <form th:action="@{/logout}" method="post">
        <button type="submit" class="btn-warn">Sign out</button>
      </form>
    </div>
  </div>
 
  <div class="grid">
    <div th:each="product : ${products}" class="product-card">
      <img th:src="${product.imageUrl} ?: '/images/cakey.jpg'"
           th:alt="${product.name} ?: 'Product'"
           alt="Product" class="product-img">
      <div class="product-body">
        <div class="product-name" th:text="${product.name}"></div>
        <div class="product-price" th:text="${product.price} + ' KSh'"></div>
        <div>
          <span th:if="${product.stockQuantity <= 10}"
                class="stock-badge stock-low">⚠️ <span th:text="${product.stockQuantity} + ' left'"></span></span>
          <span th:if="${product.stockQuantity > 10}"
                class="stock-badge stock-ok">✅ <span th:text="${product.stockQuantity} + ' in stock'"></span></span>
        </div>
      </div>
      <div class="product-footer">
        <button class="btn btn-ghost btn-sm"
                th:onclick="'openEditModal(' + ${product.id} + ', \'' + ${product.name} + '\', ' + ${product.price} + ', \'' + (${product.description} ?: '') + '\', ' + ${product.stockQuantity} + ', \'' + (${product.imageUrl} ?: '') + '\')'">
          ✏️ Edit
        </button>
        <form th:action="@{/admin/products/delete/{id}(id=${product.id})}"
              method="post"
              onsubmit="return confirm('Delete this product? This cannot be undone.')">
          <button type="submit" class="btn btn-danger btn-sm">🗑 Delete</button>
        </form>
      </div>
    </div>
  </div>
 
  <button class="fab" onclick="openModal()" title="Add Product">+</button>
 
  <!-- Modal -->
  <div class="modal-overlay" id="productModal">
    <div class="modal-box">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle">Add New Product</span>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <form id="productForm" method="post" class="modal-form">
        <input type="hidden" id="productId" name="id">
        <div class="field">
          <label>Product Name *</label>
          <input type="text" id="productName" name="name" placeholder="e.g. Chocolate Fudge Cake" required>
        </div>
        <div class="field">
          <label>Price (KSh) *</label>
          <input type="number" id="productPrice" name="price" placeholder="e.g. 2500" min="1" step="0.01" required>
        </div>
        <div class="field">
          <label>Description</label>
          <textarea id="productDesc" name="description" rows="2" placeholder="Short description for customers"></textarea>
        </div>
        <div class="field">
          <label>Stock Quantity *</label>
          <input type="number" id="productStock" name="stockQuantity" placeholder="e.g. 20" min="0" required>
        </div>
        <div class="field">
          <label>Image URL</label>
          <input type="text" id="productImage" name="imageUrl" placeholder="https://... or /images/...">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="submitBtn">💾 Save Product</button>
        </div>
      </form>
    </div>
  </div>
 
  <script>
    const modal = document.getElementById('productModal');
    function openModal() {
      document.getElementById('modalTitle').textContent = 'Add New Product';
      document.getElementById('productForm').action = '/admin/products/add';
      document.getElementById('submitBtn').textContent = '➕ Add Product';
      ['productId','productName','productPrice','productDesc','productStock','productImage']
        .forEach(id => document.getElementById(id).value = '');
      modal.classList.add('open');
    }
    function openEditModal(id,name,price,desc,stock,imageUrl) {
      document.getElementById('modalTitle').textContent = 'Edit Product';
      document.getElementById('productForm').action = '/admin/products/edit/' + id;
      document.getElementById('submitBtn').textContent = '💾 Save Changes';
      document.getElementById('productId').value = id;
      document.getElementById('productName').value = name;
      document.getElementById('productPrice').value = price;
      document.getElementById('productDesc').value = desc;
      document.getElementById('productStock').value = stock;
      document.getElementById('productImage').value = imageUrl;
      modal.classList.add('open');
    }
    function closeModal() { modal.classList.remove('open'); }
    modal.addEventListener('click', e => { if(e.target===modal) closeModal(); });
  </script>
 
</body>
</html>
