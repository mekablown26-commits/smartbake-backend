<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Orders – SmartBake Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
 
    body {
      font-family:'DM Sans',sans-serif;
      min-height:100vh;
      background:#0f0d0b url('/images/pastrey.jpg') center/cover fixed no-repeat;
      color:#e8ddd0;
      -webkit-font-smoothing:antialiased;
      position:relative;
    }
    body::before {
      content:'';
      position:fixed; inset:0;
      background:linear-gradient(160deg,rgba(10,7,5,0.9) 0%,rgba(12,9,7,0.82) 100%);
      z-index:0;
    }
    body > * { position:relative; z-index:1; }
 
    /* ── Topbar ── */
    .topbar {
      display:flex; align-items:center; justify-content:space-between;
      padding:1rem 2rem;
      background:rgba(15,13,11,0.97);
      -webkit-backdrop-filter:blur(20px);
      backdrop-filter:blur(20px);
      border-bottom:1px solid rgba(196,130,60,0.2);
      position:sticky; top:0; z-index:100;
      gap:1rem; flex-wrap:wrap;
    }
    .brand { font-family:'Playfair Display',serif; font-size:1.3rem; font-weight:700; color:#f5ede0; }
    .brand span { color:#e8b84b; }
 
    .btn {
      display:inline-flex; align-items:center; gap:0.35rem;
      padding:0.48rem 1.1rem; border-radius:999px;
      font-family:'DM Sans',sans-serif; font-size:0.83rem; font-weight:600;
      cursor:pointer; border:none; text-decoration:none;
      transition:transform 0.2s,box-shadow 0.2s;
    }
    .btn-ghost { background:transparent; color:#9a8e82; border:1px solid rgba(255,255,255,0.1); }
    .btn-ghost:hover { border-color:rgba(196,130,60,0.3); color:#e8b84b; }
    .btn-primary { background:linear-gradient(135deg,#c43050,#9e1f3b); color:#fff; box-shadow:0 4px 14px rgba(196,48,80,0.32); }
    .btn-primary:hover { transform:translateY(-1px); box-shadow:0 6px 20px rgba(196,48,80,0.5); color:#fff; }
 
    /* ── Container ── */
    .container { max-width:1200px; margin:2.5rem auto; padding:0 1.5rem 4rem; }
 
    /* ── Header row ── */
    .page-header {
      display:flex; align-items:flex-start; justify-content:space-between;
      gap:1.5rem; flex-wrap:wrap;
      margin-bottom:2rem;
      animation:fadeUp 0.5s ease both;
    }
    .page-header h1 {
      font-family:'Playfair Display',serif;
      font-size:clamp(1.75rem,4vw,2.75rem);
      color:#f5ede0;
    }
 
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(18px); }
      to   { opacity:1; transform:translateY(0); }
    }
 
    /* ── Controls ── */
    .controls {
      display:flex; gap:1rem; flex-wrap:wrap; align-items:center;
      animation:fadeUp 0.5s 0.08s ease both;
    }
 
    .search-wrap { position:relative; }
    .search-input {
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:999px;
      padding:0.65rem 1.1rem 0.65rem 2.75rem;
      color:#e8ddd0;
      font-family:'DM Sans',sans-serif; font-size:0.875rem;
      outline:none; width:260px;
      transition:border-color 0.22s,box-shadow 0.22s;
    }
    .search-input::placeholder { color:#4a4038; }
    .search-input:focus {
      border-color:#c8922a;
      box-shadow:0 0 0 3px rgba(200,146,42,0.14);
    }
    .search-icon {
      position:absolute; left:0.9rem; top:50%;
      transform:translateY(-50%);
      color:#7a6e66; font-size:0.9rem; pointer-events:none;
    }
 
    .filters { display:flex; gap:0.5rem; flex-wrap:wrap; }
    .filter-btn {
      padding:0.45rem 1rem; border-radius:999px;
      background:rgba(255,255,255,0.04);
      color:#9a8e82; border:1px solid rgba(255,255,255,0.08);
      font-family:'DM Sans',sans-serif; font-size:0.8rem; font-weight:600;
      cursor:pointer; transition:background 0.2s,color 0.2s,border-color 0.2s;
    }
    .filter-btn:hover { background:rgba(196,48,80,0.12); color:#f5ede0; border-color:rgba(196,48,80,0.3); }
    .filter-btn.active {
      background:linear-gradient(135deg,#c43050,#9e1f3b);
      color:#fff; border-color:transparent;
      box-shadow:0 3px 10px rgba(196,48,80,0.35);
    }
 
    /* ── Table ── */
    .table-card {
      background:rgba(20,16,12,0.92);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      border:1px solid rgba(196,130,60,0.18);
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 24px 64px rgba(0,0,0,0.6);
      animation:fadeUp 0.5s 0.12s ease both;
    }
 
    table { width:100%; border-collapse:collapse; font-size:0.875rem; }
 
    thead th {
      background:rgba(196,48,80,0.14);
      color:#f5ede0;
      font-size:0.73rem; font-weight:700;
      text-transform:uppercase; letter-spacing:0.08em;
      padding:1rem 1.25rem;
      border-bottom:1px solid rgba(196,48,80,0.2);
      text-align:left;
    }
    tbody td {
      padding:1rem 1.25rem;
      border-bottom:1px solid rgba(255,255,255,0.04);
      color:#e8ddd0; vertical-align:middle;
    }
    tbody tr:last-child td { border-bottom:none; }
    tbody tr {
      cursor:pointer;
      transition:background 0.2s;
    }
    tbody tr:hover td { background:rgba(196,48,80,0.06); }
 
    .order-num { font-weight:700; color:#e8b84b; }
 
    /* Status pills */
    .pill {
      padding:0.28rem 0.8rem; border-radius:999px;
      font-size:0.72rem; font-weight:700;
      display:inline-block; text-transform:uppercase; letter-spacing:0.05em;
    }
    .pill-pending    { background:rgba(234,179,8,0.15);  color:#fcd34d; border:1px solid rgba(234,179,8,0.28); }
    .pill-processing { background:rgba(59,130,246,0.15); color:#93c5fd; border:1px solid rgba(59,130,246,0.28); }
    .pill-ready      { background:rgba(34,197,94,0.15);  color:#86efac; border:1px solid rgba(34,197,94,0.28); }
    .pill-delivered  { background:rgba(16,185,129,0.12); color:#6ee7b7; border:1px solid rgba(16,185,129,0.22); }
    .pill-cancelled  { background:rgba(185,28,28,0.15);  color:#fca5a5; border:1px solid rgba(185,28,28,0.28); }
 
    .action-link {
      color:#e8b84b; font-weight:600; text-decoration:none;
      font-size:0.83rem; transition:color 0.2s;
    }
    .action-link:hover { color:#c8922a; }
 
    /* ── Empty state ── */
    .empty-state {
      text-align:center; padding:6rem 2rem;
      background:rgba(20,16,12,0.9);
      border:1px solid rgba(196,130,60,0.15);
      border-radius:20px;
      animation:fadeUp 0.5s ease both;
    }
    .empty-state .icon { font-size:3.5rem; margin-bottom:1rem; }
    .empty-state p { color:#7a6e66; font-size:1.05rem; }
 
    .back-wrap { text-align:center; margin-top:2rem; animation:fadeUp 0.5s 0.2s ease both; }
 
    @media (max-width:768px) {
      .topbar { padding:0.85rem 1.25rem; }
      .container { padding:0 1rem 3rem; }
      .page-header { flex-direction:column; }
      .search-input { width:100%; }
      table { font-size:0.8rem; }
      thead th, tbody td { padding:0.8rem 0.9rem; }
    }
  </style>
</head>
<body>
 
  <div class="topbar">
    <div class="brand">SMART<span>BAKE</span> Admin</div>
    <div style="display:flex;gap:0.75rem;">
      <a href="/admin/products" class="btn btn-ghost">Products</a>
      <a href="/dashboard"      class="btn btn-ghost">Dashboard</a>
    </div>
  </div>
 
  <div class="container">
 
    <div class="page-header">
      <h1>📦 All Orders</h1>
      <div class="controls">
        <div class="search-wrap">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" class="search-input" placeholder="Search order, customer, status…">
        </div>
        <div class="filters">
          <button class="filter-btn active" onclick="filterStatus('', this)">All</button>
          <button class="filter-btn" onclick="filterStatus('PENDING', this)">Pending</button>
          <button class="filter-btn" onclick="filterStatus('PROCESSING', this)">Processing</button>
          <button class="filter-btn" onclick="filterStatus('READY', this)">Ready</button>
          <button class="filter-btn" onclick="filterStatus('DELIVERED', this)">Delivered</button>
          <button class="filter-btn" onclick="filterStatus('CANCELLED', this)">Cancelled</button>
        </div>
      </div>
    </div>
 
    <!-- Table -->
    <div th:if="${orders != null and !orders.empty}" class="table-card">
      <table id="ordersTable">
        <thead>
          <tr>
            <th>Order #</th>
            <th>Customer</th>
            <th>Payment</th>
            <th>Total</th>
            <th>Status</th>
            <th>Placed On</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="order : ${orders}"
              class="order-row"
              th:data-status="${order.status}"
              th:onclick="'window.location=\'' + @{/admin/orders/{id}(id=${order.id})} + '\''">
            <td><span class="order-num" th:text="'SB-' + ${order.id}"></span></td>
            <td th:text="${order.customerName != null ? order.customerName : (order.user?.email != null ? order.user.email : 'Guest')}"></td>
            <td th:text="${order.paymentMethod == 'CASH' ? '💵 Cash' : order.paymentMethod == 'PAYBILL' ? '📱 Paybill' : order.paymentMethod}"></td>
            <td style="color:#e8b84b;font-weight:600;" th:text="${order.totalAmount} + ' KSh'"></td>
            <td>
              <span class="pill"
                    th:classappend="'pill-' + ${#strings.toLowerCase(order.status)}"
                    th:text="${order.status}"></span>
            </td>
            <td th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy, HH:mm')}"></td>
            <td>
              <a th:href="@{/admin/orders/{id}(id=${order.id})}"
                 class="action-link"
                 onclick="event.stopPropagation()">View →</a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
 
    <!-- Empty -->
    <div th:if="${orders == null or orders.empty}" class="empty-state">
      <div class="icon">🍪</div>
      <p>No orders yet — the oven is warming up!</p>
    </div>
 
    <div class="back-wrap">
      <a href="/dashboard" class="btn btn-primary">← Back to Dashboard</a>
    </div>
 
  </div>
 
  <script>
    // Live search
    document.getElementById('searchInput').addEventListener('input', function () {
      const q = this.value.toLowerCase();
      document.querySelectorAll('#ordersTable tbody tr').forEach(row => {
        row.style.display = row.textContent.toLowerCase().includes(q) ? '' : 'none';
      });
    });
 
    // Status filter
    function filterStatus(status, btn) {
      document.querySelectorAll('#ordersTable tbody tr').forEach(row => {
        const s = row.getAttribute('data-status');
        row.style.display = (!status || s === status) ? '' : 'none';
      });
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
  </script>
 
</body>
</html>
