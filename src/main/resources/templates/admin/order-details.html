<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Details – SmartBake Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
 
    body {
      font-family:'DM Sans',sans-serif;
      min-height:100vh;
      background:#0f0d0b url('/images/donuts.jpg') center/cover fixed no-repeat;
      color:#e8ddd0;
      -webkit-font-smoothing:antialiased;
      position:relative;
    }
    body::before {
      content:'';
      position:fixed; inset:0;
      background:linear-gradient(160deg,rgba(10,7,5,0.9) 0%,rgba(12,9,7,0.82) 100%);
      z-index:0;
    }
    body > * { position:relative; z-index:1; }
 
    /* ── Topbar ── */
    .topbar {
      display:flex; align-items:center; justify-content:space-between;
      padding:1rem 2rem;
      background:rgba(15,13,11,0.97);
      -webkit-backdrop-filter:blur(20px);
      backdrop-filter:blur(20px);
      border-bottom:1px solid rgba(196,130,60,0.2);
      position:sticky; top:0; z-index:100;
      gap:1rem; flex-wrap:wrap;
    }
    .brand { font-family:'Playfair Display',serif; font-size:1.3rem; font-weight:700; color:#f5ede0; }
    .brand span { color:#e8b84b; }
 
    .btn {
      display:inline-flex; align-items:center; gap:0.35rem;
      padding:0.5rem 1.1rem; border-radius:999px;
      font-family:'DM Sans',sans-serif; font-size:0.83rem; font-weight:600;
      cursor:pointer; border:none; text-decoration:none;
      transition:transform 0.2s,box-shadow 0.2s;
    }
    .btn-ghost { background:transparent; color:#9a8e82; border:1px solid rgba(255,255,255,0.1); }
    .btn-ghost:hover { border-color:rgba(196,130,60,0.3); color:#e8b84b; }
    .btn-primary { background:linear-gradient(135deg,#c43050,#9e1f3b); color:#fff; box-shadow:0 4px 14px rgba(196,48,80,0.32); }
    .btn-primary:hover { transform:translateY(-1px); box-shadow:0 6px 20px rgba(196,48,80,0.5); color:#fff; }
 
    /* ── Container ── */
    .container { max-width:1000px; margin:2.5rem auto; padding:0 1.5rem 4rem; }
 
    /* ── Page header ── */
    .page-header { text-align:center; margin-bottom:2rem; }
    .page-header h1 {
      font-family:'Playfair Display',serif;
      font-size:clamp(1.75rem,4vw,2.75rem);
      color:#f5ede0;
      margin-bottom:0.4rem;
      animation:fadeUp 0.5s ease both;
    }
    .page-header p { color:#7a6e66; animation:fadeUp 0.5s 0.1s ease both; }
    .page-header strong { color:#e8b84b; }
 
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(18px); }
      to   { opacity:1; transform:translateY(0); }
    }
 
    /* ── Flash messages ── */
    .flash {
      padding:0.85rem 1.1rem; border-radius:12px;
      font-size:0.9rem; font-weight:500; margin-bottom:1.25rem;
    }
    .flash-success { background:rgba(22,163,74,0.15); border:1px solid rgba(22,163,74,0.3); color:#86efac; }
    .flash-error   { background:rgba(185,28,28,0.15); border:1px solid rgba(185,28,28,0.35); color:#fca5a5; }
 
    /* ── Cards ── */
    .card {
      background:rgba(20,16,12,0.92);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      border:1px solid rgba(196,130,60,0.18);
      border-radius:20px;
      padding:2rem;
      margin-bottom:1.75rem;
      box-shadow:0 20px 60px rgba(0,0,0,0.55);
      animation:fadeUp 0.5s ease both;
    }
    .card:nth-child(2) { animation-delay:0.1s; }
    .card:nth-child(3) { animation-delay:0.2s; }
 
    .card-title {
      font-family:'Playfair Display',serif;
      font-size:1.15rem;
      color:#f5ede0;
      margin-bottom:1.25rem;
      padding-bottom:0.75rem;
      border-bottom:1px solid rgba(255,255,255,0.06);
    }
 
    /* ── Info grid ── */
    .info-grid {
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
      gap:1rem;
      margin-bottom:1.5rem;
    }
    .info-item {
      background:rgba(255,255,255,0.03);
      border:1px solid rgba(255,255,255,0.07);
      border-radius:12px;
      padding:1rem 1.1rem;
    }
    .info-label {
      font-size:0.72rem;
      font-weight:700;
      color:#8a7e76;
      text-transform:uppercase;
      letter-spacing:0.07em;
      margin-bottom:0.35rem;
    }
    .info-value { color:#f5ede0; font-weight:600; font-size:0.95rem; }
 
    /* ── Status badge ── */
    .status-center { text-align:center; margin:1.25rem 0; }
    .status-badge {
      display:inline-flex; align-items:center;
      padding:0.55rem 1.5rem; border-radius:999px;
      font-weight:700; font-size:1rem;
      letter-spacing:0.05em; text-transform:uppercase;
    }
    .status-pending    { background:rgba(234,179,8,0.15);  color:#fcd34d; border:1px solid rgba(234,179,8,0.3); }
    .status-processing { background:rgba(59,130,246,0.15); color:#93c5fd; border:1px solid rgba(59,130,246,0.3); }
    .status-ready      { background:rgba(34,197,94,0.15);  color:#86efac; border:1px solid rgba(34,197,94,0.3); box-shadow:0 0 16px rgba(34,197,94,0.15); }
    .status-delivered  { background:rgba(16,185,129,0.15); color:#6ee7b7; border:1px solid rgba(16,185,129,0.28); box-shadow:0 0 16px rgba(16,185,129,0.12); }
    .status-cancelled  { background:rgba(185,28,28,0.15);  color:#fca5a5; border:1px solid rgba(185,28,28,0.3); }
 
    /* ── Forms ── */
    .form { display:flex; flex-direction:column; gap:1rem; margin-top:1rem; }
    .field { display:flex; flex-direction:column; gap:0.35rem; }
    .two-col { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
 
    label {
      font-size:0.77rem; font-weight:600;
      color:#8a7e76; text-transform:uppercase; letter-spacing:0.07em;
    }
    select, input[type="text"], input[type="number"] {
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:11px;
      padding:0.72rem 1rem;
      color:#e8ddd0;
      font-family:'DM Sans',sans-serif; font-size:0.9rem;
      outline:none; width:100%;
      transition:border-color 0.22s,box-shadow 0.22s;
    }
    select option { background:#1a1612; }
    select:focus, input:focus {
      border-color:#c8922a;
      box-shadow:0 0 0 3px rgba(200,146,42,0.14);
    }
 
    .btn-save {
      align-self:flex-start;
      padding:0.65rem 1.75rem;
      background:linear-gradient(135deg,#c43050,#9e1f3b);
      color:#fff; border:none; border-radius:999px;
      font-family:'DM Sans',sans-serif; font-size:0.9rem; font-weight:700;
      cursor:pointer;
      box-shadow:0 4px 16px rgba(196,48,80,0.35);
      transition:transform 0.22s,box-shadow 0.22s;
    }
    .btn-save:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(196,48,80,0.5); }
 
    /* ── Rider display ── */
    .rider-info {
      margin-top:1.5rem;
      padding:1.25rem 1.5rem;
      background:rgba(22,163,74,0.08);
      border:1px solid rgba(22,163,74,0.2);
      border-radius:14px;
    }
    .rider-info h3 { font-size:0.95rem; color:#86efac; margin-bottom:0.75rem; font-weight:600; }
    .rider-info p  { font-size:0.875rem; color:#e8ddd0; line-height:1.9; }
    .rider-info strong { color:#e8b84b; }
 
    /* ── Table ── */
    .table-wrap { overflow-x:auto; margin-top:0.5rem; }
    table { width:100%; border-collapse:collapse; font-size:0.875rem; }
    thead th {
      color:#e8b84b;
      font-size:0.73rem; font-weight:700;
      text-transform:uppercase; letter-spacing:0.07em;
      padding:0.8rem 1rem;
      border-bottom:1px solid rgba(196,130,60,0.2);
      text-align:left;
    }
    tbody td {
      padding:0.9rem 1rem;
      border-bottom:1px solid rgba(255,255,255,0.05);
      color:#e8ddd0;
    }
    tbody tr:last-child td { border-bottom:none; }
    .total-row td {
      background:rgba(200,146,42,0.08);
      color:#e8b84b !important;
      font-weight:700;
      border-top:1px solid rgba(196,130,60,0.2);
    }
 
    /* ── Back button ── */
    .back-wrap { text-align:center; margin-top:2rem; }
 
    @media (max-width:640px) {
      .container { padding:0 1rem 3rem; }
      .two-col { grid-template-columns:1fr; }
      .card { padding:1.5rem; }
    }
  </style>
</head>
<body>
 
  <div class="topbar">
    <div class="brand">SMART<span>BAKE</span> Admin</div>
    <div style="display:flex;gap:0.75rem;">
      <a th:if="${isAdmin}" href="/admin/orders" class="btn btn-ghost">← All Orders</a>
      <a th:unless="${isAdmin}" href="/my-orders" class="btn btn-ghost">← My Orders</a>
      <a href="/dashboard" class="btn btn-ghost">Dashboard</a>
    </div>
  </div>
 
  <div class="container">
 
    <div class="page-header">
      <h1>Order Details</h1>
      <p>Order Number: <strong th:text="${orderNumber} ?: 'SB-' + ${order.id}"></strong></p>
    </div>
 
    <div th:if="${message}" class="flash flash-success" th:text="${message}"></div>
    <div th:if="${error}"   class="flash flash-error"   th:text="${error}"></div>
 
    <!-- Main info card -->
    <div class="card">
      <div class="info-grid">
        <div class="info-item">
          <div class="info-label">Customer</div>
          <div class="info-value" th:text="${order.user.email}"></div>
        </div>
        <div class="info-item">
          <div class="info-label">Placed On</div>
          <div class="info-value" th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy, HH:mm')}"></div>
        </div>
        <div class="info-item">
          <div class="info-label">Payment</div>
          <div class="info-value"
               th:text="${order.paymentMethod == 'CASH' ? '💵 Cash on Delivery' :
                          order.paymentMethod == 'PAYBILL' ? '📱 M-Pesa Paybill' : order.paymentMethod}"></div>
        </div>
        <div class="info-item">
          <div class="info-label">Total</div>
          <div class="info-value" style="color:#e8b84b;" th:text="${order.totalAmount} + ' KSh'"></div>
        </div>
      </div>
 
      <div class="status-center">
        <span class="status-badge"
              th:classappend="'status-' + ${#strings.toLowerCase(order.status)}"
              th:text="${order.status ?: 'Not Set'}"></span>
      </div>
 
      <!-- Status update (admin only) -->
      <div th:if="${isAdmin}">
        <div class="card-title" style="margin-top:1.5rem;">Update Status</div>
        <form th:action="@{/admin/orders/{id}/update-status(id=${order.id})}" method="post" class="form">
          <div class="field">
            <label for="status">New Status</label>
            <select name="status" id="status">
              <option value="PENDING"    th:selected="${order.status == 'PENDING'}">PENDING</option>
              <option value="PROCESSING" th:selected="${order.status == 'PROCESSING'}">PROCESSING</option>
              <option value="READY"      th:selected="${order.status == 'READY'}">READY</option>
              <option value="DELIVERED"  th:selected="${order.status == 'DELIVERED'}">DELIVERED</option>
              <option value="CANCELLED"  th:selected="${order.status == 'CANCELLED'}">CANCELLED</option>
            </select>
          </div>
          <button type="submit" class="btn-save">💾 Save Status</button>
        </form>
      </div>
 
      <!-- Delivery info form (admin only) -->
      <div th:if="${isAdmin}" style="margin-top:2rem;">
        <div class="card-title">Delivery / Rider Info</div>
        <form th:action="@{/admin/orders/{id}/update-delivery(id=${order.id})}" method="post" class="form">
          <div class="two-col">
            <div class="field">
              <label for="riderName">Rider Name</label>
              <input type="text" id="riderName" name="riderName" th:value="${order.riderName}" placeholder="e.g. John Kamau">
            </div>
            <div class="field">
              <label for="riderPhone">Rider Phone</label>
              <input type="text" id="riderPhone" name="riderPhone" th:value="${order.riderPhone}" placeholder="07XX XXX XXX">
            </div>
            <div class="field">
              <label for="riderBikePlate">Bike Plate</label>
              <input type="text" id="riderBikePlate" name="riderBikePlate" th:value="${order.riderBikePlate}" placeholder="KAA 123X">
            </div>
            <div class="field">
              <label for="deliveryFee">Delivery Fee (KSh)</label>
              <input type="number" id="deliveryFee" name="deliveryFee" th:value="${order.deliveryFee}" step="0.01" placeholder="200">
            </div>
          </div>
          <button type="submit" class="btn-save">💾 Save Delivery Info</button>
        </form>
      </div>
 
      <!-- Rider display -->
      <div th:if="${order.riderName != null}" class="rider-info">
        <h3>🏍️ Delivery Details</h3>
        <p>
          <strong>Rider:</strong> <span th:text="${order.riderName}"></span>
          (<span th:text="${order.riderPhone}"></span>)<br>
          <strong>Bike:</strong> <span th:text="${order.riderBikePlate}"></span><br>
          <strong>Fee:</strong> <span th:text="${order.deliveryFee} + ' KSh'"></span>
        </p>
      </div>
    </div>
 
    <!-- Items table -->
    <div class="card">
      <div class="card-title">Ordered Items</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Product</th>
              <th>Qty</th>
              <th>Price / Unit</th>
              <th>Subtotal</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="item : ${order.items}">
              <td th:text="${item.product.name}"></td>
              <td th:text="${item.quantity}"></td>
              <td th:text="${item.priceAtPurchase} + ' KSh'"></td>
              <td style="color:#e8b84b;font-weight:600;" th:text="${item.subtotal} + ' KSh'"></td>
            </tr>
            <tr class="total-row">
              <td colspan="3" style="text-align:right;">Total</td>
              <td th:text="${order.totalAmount} + ' KSh'"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
 
    <div class="back-wrap">
      <a th:if="${isAdmin}"   href="/admin/orders" class="btn btn-primary">← Back to All Orders</a>
      <a th:unless="${isAdmin}" href="/my-orders"  class="btn btn-primary">← Back to My Orders</a>
    </div>
 
  </div>
 
</body>
</html>
