<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact – SmartBake</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
 
  <nav class="navbar">
    <div class="navbar-brand">SMART<span>BAKE</span></div>
    <div class="navbar-actions">
      <a href="/dashboard" class="btn btn-ghost btn-sm">← Dashboard</a>
    </div>
  </nav>
 
  <div class="page-header">
    <h1 class="fade-up">Contact Us 📞</h1>
    <p class="fade-up delay-1">We're always happy to help</p>
  </div>
 
  <div class="container">
    <div class="contact-card card fade-up">
      <p style="color:var(--text-muted);font-size:1.0625rem;margin-bottom:1.5rem;">
        Call or WhatsApp us anytime — we're available 7 AM to 10 PM daily.
      </p>
 
      <a th:href="@{'tel:' + ${contactPhone}}"
         class="phone-display"
         th:text="${contactPhone}">0712345678</a>
 
      <a th:href="${whatsappLink}"
         target="_blank"
         class="btn btn-whatsapp btn-block"
         style="margin-bottom:1.5rem;">
        💬 Chat on WhatsApp
      </a>
 
      <p style="color:var(--text-muted);font-size:0.9rem;line-height:1.7;">
        🕐 Available 7 AM – 10 PM daily<br>
        📍 123 Bakery Lane, Westlands, Nairobi<br>
        ✉️ smartbakei.a.n@gmail.com
      </p>
 
      <div style="margin-top:2rem;">
        <a href="/dashboard" class="btn btn-ghost btn-sm">← Back to Dashboard</a>
      </div>
    </div>
  </div>
 
</body>
</html>
