<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In – SmartBake</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page bg-image" style="background-image:url('/images/croissants.jpg');">
 
  <div class="auth-card fade-up">
    <div class="auth-logo">SMART<span>BAKE</span></div>
    <p class="auth-subtitle">Welcome back — your treats await 🥐</p>
 
    <div th:if="${param.error}" class="alert alert-error">
      ⚠️ Invalid email or password. Please try again.
    </div>
    <div th:if="${param.logout}" class="alert alert-success">
      ✅ You've been logged out successfully.
    </div>
 
    <form th:action="@{/login}" method="post" class="auth-form">
      <div class="form-group">
        <label class="form-label">Email address</label>
        <input class="form-input" type="email" name="username" placeholder="you@example.com" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" type="password" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" style="margin-top:0.5rem;">Sign In</button>
    </form>
 
    <div class="auth-footer">
      Don't have an account? <a href="/register">Create one →</a>
    </div>
  </div>
 
</body>
</html>
